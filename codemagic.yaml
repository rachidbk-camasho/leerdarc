workflows:
  ios-app-store:
    name: Leer Darija - iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic_asc_api_key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.leerdarija.app
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Bootstrap native iOS/Android project files
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios,android --org com.leerdarija --project-name app .
          fi

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate app icon
        script: |
          dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Flutter analyze
        script: |
          flutter analyze || true

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Build IPA for App Store
        script: |
          flutter build ipa \
            --release \
            --build-name=3.0.0 \
            --build-number=13 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false


  android-internal:
    name: Leer Darija - Android
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Bootstrap native Android project files
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.leerdarija --project-name app .
          fi

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate app icon
        script: |
          dart run flutter_launcher_icons

      - name: Flutter analyze
        script: |
          flutter analyze || true

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.apk
